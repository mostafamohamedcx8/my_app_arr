# Integration tests: activate together with 'local' -> @ActiveProfiles({"local", "test"}).
# 'local' supplies DB credentials and secrets; this file points the app at a SEPARATE database
# so tests never touch the development data in `myapp`.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${TEST_DB_NAME:myapp_test}?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

app:
  storage:
    root: target/test-uploads
  whatsapp:
    provider: test        # RecordingWhatsAppSender (src/test) keeps OTPs in memory
  maps:
    provider: fake        # FakeDistanceService (src/test) — never calls Google
